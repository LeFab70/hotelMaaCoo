<section class="hero" id="accueil">
  <div class="hero__media" aria-hidden="true">
    <img
      class="hero__img hero__img--main"
      src="assets/hotel/hero/hero-main.jpg"
      alt=""
    />
    <img
      class="hero__img hero__img--fade"
      src="assets/hotel/exteriors/nkong-facade.jpg"
      alt=""
    />
    <div class="hero__veil"></div>
    <div class="hero__grain"></div>
  </div>

  <div class="hero__content container">
    <p class="hero__eyebrow">Bertoua · Douala · Nkong-Ni</p>
    <p class="hero__brand">Hôtel MA'ACO</p>
    <h1>L’hospitalité camerounaise,<br />tout simplement bien faite</h1>
    <p class="hero__lead">
      Parking sécurisé, chambres confortables, restaurant et salles pour vos
      événements — réservez en un appel.
    </p>
    <div class="hero__cta">
      <a
        class="btn btn-primary"
        appMagnetic
        [href]="hotelService.phoneLink(hotelService.selected().phones[0])"
      >
        <svg lucidePhone [size]="18"></svg>
        Appeler pour réserver
      </a>
      <a class="hero__link" href="#hotels">
        Voir les 3 adresses
        <svg lucideChevronDown [size]="16"></svg>
      </a>
    </div>
    <div class="hero__meta">
      <span>
        <svg lucideMapPin [size]="16"></svg>
        3 villes · 100+ chambres · 40 000+ clients
      </span>
    </div>
  </div>

  <a class="hero__scroll" href="#hotels" aria-label="Défiler vers les hôtels">
    <span>Explorer</span>
    <svg lucideChevronDown [size]="18"></svg>
  </a>
</section>
