services:
  - type: web
    name: hotel-maaco
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/maaco-hotel/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
